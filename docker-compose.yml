services:
  init:
    image: busybox:latest
    container_name: sisyphusgate-init
    restart: "no"
    volumes:
      - ${SISYPHUSGATE_BASE:-.}/logs:/logs
      - ${SISYPHUSGATE_BASE:-.}/data:/data
    command: >
      sh -c "mkdir -p /logs/sisyphusgate /logs/cowrie /data/cowrie
      && chmod -R 777 /logs /data
      && chown -R 65534:65534 /logs/cowrie /data/cowrie"

  sisyphusgate:
    image: ${SISYPHUSGATE_IMAGE:-ghcr.io/refreshcoder/sisyphusgate:latest}
    container_name: sisyphusgate
    restart: unless-stopped
    ports:
      - "2222:2222"
      - "2323:2323"
      - "8080:8080"
    volumes:
      - ${SISYPHUSGATE_BASE:-.}/logs/sisyphusgate:/app/logs
      - ${SISYPHUSGATE_BASE:-.}/data:/app/data
    environment:
      - SISYPHUSGATE_CONFIG=/app/config/docker.yaml
      - SISYPHUSGATE_LOG_LEVEL=${SISYPHUSGATE_LOG_LEVEL:-INFO}
      - PYTHONUNBUFFERED=1
    depends_on:
      init:
        condition: service_completed_successfully
      cowrie:
        condition: service_started
      endlessh:
        condition: service_started
    networks:
      - default
      - honeynet
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  cowrie:
    image: cowrie/cowrie:latest
    container_name: sisyphusgate-cowrie
    restart: unless-stopped
    volumes:
      - ${SISYPHUSGATE_BASE:-.}/config/cowrie/etc/cowrie.cfg:/cowrie/cowrie-git/etc/cowrie.cfg:ro
      - ${SISYPHUSGATE_BASE:-.}/logs/cowrie:/cowrie/cowrie-git/var/log/cowrie
      - ${SISYPHUSGATE_BASE:-.}/data/cowrie:/cowrie/cowrie-git/var/lib/cowrie
    depends_on:
      init:
        condition: service_completed_successfully
    networks:
      - honeynet
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  endlessh:
    image: shizunge/endlessh-go:latest
    container_name: sisyphusgate-endlessh
    restart: unless-stopped
    ports:
      - "2221:2221"
    command:
      - "-port=2221"
      - "-interval_ms=${TARPIT_DELAY_MS:-10000}"
      - "-max_clients=${TARPIT_MAX_CLIENTS:-4096}"
      - "-logtostderr"
      - "-v=1"
    networks:
      - honeynet
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M

networks:
  honeynet:
    driver: bridge
