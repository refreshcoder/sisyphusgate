services:
  sisyphusgate:
    image: ${SISYPHUSGATE_IMAGE:-ghcr.io/refreshcoder/sisyphusgate:latest}
    container_name: sisyphusgate
    restart: unless-stopped
    ports:
      - "${SISYPHUSGATE_SSH_PORT:-2222}:2222"
      - "${SISYPHUSGATE_TELNET_PORT:-2323}:2323"
      - "${SISYPHUSGATE_HTTP_PORT:-8080}:8080"
    volumes:
      - ${SISYPHUSGATE_BASE:-.}/logs/sisyphusgate:/app/logs
      - ${SISYPHUSGATE_BASE:-.}/data:/app/data
      - ${SISYPHUSGATE_BASE:-.}/logs/cowrie:/cowrie-logs:ro
    environment:
      - SISYPHUSGATE_CONFIG=/app/config/docker.yaml
      - SISYPHUSGATE_LOG_LEVEL=${SISYPHUSGATE_LOG_LEVEL:-INFO}
    depends_on:
      cowrie:
        condition: service_started
      endlessh:
        condition: service_started
    networks:
      - default
      - honeynet
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  cowrie:
    image: cowrie/cowrie:latest
    container_name: sisyphusgate-cowrie
    restart: unless-stopped
    volumes:
      - ${SISYPHUSGATE_BASE:-.}/logs/cowrie:/cowrie/cowrie-git/var/log/cowrie
      - ${SISYPHUSGATE_BASE:-.}/config/cowrie/etc/cowrie.cfg:/cowrie/cowrie-git/etc/cowrie.cfg:ro
    tmpfs:
      - /tmp
      - /cowrie/cowrie-git/var/lib/cowrie
    networks:
      - honeynet
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  endlessh:
    image: shizunge/endlessh-go:latest
    container_name: sisyphusgate-endlessh
    restart: unless-stopped
    environment:
      - ENDLESSH_DELAY=${TARPIT_DELAY_MS:-10000}
      - ENDLESSH_MAX_CLIENTS=${TARPIT_MAX_CLIENTS:-4096}
    networks:
      - honeynet
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M

  snare:
    image: mushorg/snare:latest
    container_name: sisyphusgate-snare
    restart: "no"
    environment:
      - TANNER_HOST=http://tanner:8090
    depends_on:
      - tanner
    tmpfs:
      - /tmp
    networks:
      - honeynet
    security_opt:
      - no-new-privileges:true
    profiles:
      - http_honeypot
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  tanner:
    image: mushorg/tanner:latest
    container_name: sisyphusgate-tanner
    restart: "no"
    tmpfs:
      - /tmp
    networks:
      - honeynet
    security_opt:
      - no-new-privileges:true
    profiles:
      - http_honeypot

networks:
  honeynet:
    driver: bridge
    internal: true
