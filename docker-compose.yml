services:
  sisyphusgate:
    image: ${SISYPHUSGATE_IMAGE:-ghcr.io/sisyphusgate/sisyphusgate:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: "3.11-slim"
        BUILD_DATE: ${BUILD_DATE:-}
        VCS_REF: ${VCS_REF:-}
        VERSION: ${VERSION:-0.1.0}
    container_name: sisyphusgate
    restart: unless-stopped
    ports:
      - "${SISYPHUSGATE_SSH_PORT:-2222}:2222"
      - "${SISYPHUSGATE_TELNET_PORT:-2323}:2323"
      - "${SISYPHUSGATE_HTTP_PORT:-8080}:8080"
    volumes:
      - sisyphusgate-logs:/app/logs
      - sisyphusgate-data:/app/data
      - cowrie-logs:/cowrie-logs:ro
    environment:
      - SISYPHUSGATE_CONFIG=/app/config/docker.yaml
      - SISYPHUSGATE_LOG_LEVEL=${SISYPHUSGATE_LOG_LEVEL:-INFO}
    depends_on:
      cowrie:
        condition: service_healthy
      endlessh:
        condition: service_started
    networks:
      - default
      - honeynet
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  cowrie:
    image: cowrie/cowrie:latest
    container_name: sisyphusgate-cowrie
    restart: unless-stopped
    volumes:
      - cowrie-logs:/cowrie/cowrie-git/var/log/cowrie
      - ./config/cowrie/etc:/cowrie/cowrie-git/etc:ro
    read_only: true
    tmpfs:
      - /tmp
      - /cowrie/cowrie-git/var/log/cowrie
    networks:
      - honeynet
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.settimeout(3); s.connect(('127.0.0.1',2222)); s.close()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  endlessh:
    image: shizunge/endlessh-go:latest
    container_name: sisyphusgate-endlessh
    restart: unless-stopped
    environment:
      - ENDLESSH_DELAY=${TARPIT_DELAY_MS:-10000}
      - ENDLESSH_MAX_CLIENTS=${TARPIT_MAX_CLIENTS:-4096}
    read_only: true
    networks:
      - honeynet
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M

  snare:
    image: mushorg/snare:latest
    container_name: sisyphusgate-snare
    restart: "no"
    environment:
      - TANNER_HOST=http://tanner:8090
    depends_on:
      - tanner
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - honeynet
    security_opt:
      - no-new-privileges:true
    profiles:
      - http_honeypot
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  tanner:
    image: mushorg/tanner:latest
    container_name: sisyphusgate-tanner
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - honeynet
    security_opt:
      - no-new-privileges:true
    profiles:
      - http_honeypot

networks:
  honeynet:
    driver: bridge
    internal: true

volumes:
  sisyphusgate-logs:
    driver: local
  sisyphusgate-data:
    driver: local
  cowrie-logs:
    driver: local